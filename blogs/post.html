<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wenjun Que Post">
    <title>Post | Wenjun Que</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="blog.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>

<body class="blog-shell">
    <header class="site-header">
        <nav>
            <div class="container">
                <a href="../index.html" class="logo">Wenjun Que</a>
                <ul class="nav-links">
                    <li><a href="../index.html#home">Home</a></li>
                    <li><a href="../index.html#about">About</a></li>
                    <li><a href="../index.html#publications">Publications</a></li>
                    <li><a href="./">Blogs</a></li>
                    <li><a href="../index.html#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="post-hero">
            <div class="container">
                <a class="back-link" href="./">← Back to Blogs</a>
                <p class="section-kicker">Entry</p>
                <h1 id="post-title">Loading...</h1>
                <div class="post-meta-row">
                    <span id="post-date"></span>
                    <span id="post-lang"></span>
                </div>
                <div id="post-tags" class="blog-tags"></div>
            </div>
        </section>

        <section class="post-section">
            <div class="container post-layout">
                <article class="post-article-card">
                    <div id="post-content" class="post-content"></div>
                </article>
                <aside class="post-toc-panel">
                    <div class="sidebar-panel">
                        <h2>On This Page</h2>
                        <div id="post-toc" class="post-toc"></div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Wenjun Que. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="blog.js"></script>
</body>

</html>
